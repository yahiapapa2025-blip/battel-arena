<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Battle Arena - Match</title>

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<div id="game"></div>

<div id="hud">

    <div class="player-info">
        👤 <span id="username">Loading...</span>
    </div>

    <div class="stats">
        <span>💎 <b id="diamonds">0</b></span>
        <span>🪙 <b id="gold">0</b></span>
        <span>⭐ Lv.<b id="level">1</b></span>
    </div>

    <div class="combat-hud">

        <div class="health">
            ❤️

            <div class="health-bar">
                <div id="healthFill"></div>
            </div>

            <b id="healthText">100</b>
        </div>

        <div class="ammo">
            🔫 <span id="ammoText">30 / 30</span>
        </div>

    </div>

    <div class="crosshair"></div>

    <div class="controls">
        WASD حركة | Shift جري | Mouse نظر | Click إطلاق | R تلقيم
    </div>

</div>

<script>
const PLAYER_ID = "100001";

async function loadPlayer() {

    try {

        const response = await fetch(
            `/game/player/${PLAYER_ID}`
        );

        if (!response.ok) {
            throw new Error("Server Error");
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error("Player Not Found");
        }

        document.getElementById("username").textContent =
            data.username + (data.developerBadge ? " 🛡️" : "");

        document.getElementById("diamonds").textContent =
            data.diamonds;

        document.getElementById("gold").textContent =
            data.gold;

        document.getElementById("level").textContent =
            data.level;

    } catch (error) {

        console.error(error);

        document.getElementById("username").textContent =
            "Offline";
    }
}

loadPlayer();
</script>

<script type="module" src="js/game.js"></script>

</body>
</html>
