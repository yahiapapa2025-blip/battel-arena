<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Battle Arena</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at top,#26345c,#070a12 75%);
    color:white;
    font-family:Arial,sans-serif;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #35415d;
    background:#11182a;
    color:white;
    outline:none;
    text-align:center;
    font-size:16px;
}

.screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.panel{
    width:92%;
    max-width:430px;
    padding:25px;
    border-radius:22px;
    background:rgba(10,15,27,.96);
    text-align:center;
    box-shadow:0 0 40px rgba(0,0,0,.4);
}

.logo{
    font-size:55px;
}

h1{
    margin:5px 0;
}

.sub{
    color:#aab4c9;
    margin:10px 0 20px;
}

.orange{
    background:
        linear-gradient(135deg,#ff9800,#ff3d00);
}

.blue{
    background:#293657;
}

.error{
    color:#ff6565;
    margin-top:12px;
    min-height:20px;
}

.success{
    color:#63e6be;
    margin-top:12px;
}

#lobby{
    display:none;
    position:fixed;
    inset:0;
    overflow:hidden;
}

#scene{
    position:absolute;
    inset:0;
    z-index:1;
}

.topbar{
    position:absolute;
    z-index:20;
    top:15px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.player-info,
.currency{
    background:rgba(7,11,20,.9);
    padding:10px 14px;
    border-radius:12px;
}

.currencies{
    display:flex;
    gap:8px;
}

.diamond{
    color:#55c8ff;
}

.gold{
    color:#ffd34e;
}

.character-name{
    position:absolute;
    z-index:20;

    bottom:170px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(5,8,15,.85);
    padding:8px 18px;
    border-radius:12px;

    white-space:nowrap;
}

.play{
    position:absolute;
    z-index:20;

    bottom:90px;
    left:50%;

    transform:translateX(-50%);

    width:190px;

    background:
        linear-gradient(135deg,#ff9800,#ff3d00);
}

.menu{
    position:absolute;
    z-index:20;

    bottom:25px;
    left:15px;
    right:15px;

    display:flex;
    gap:8px;
}

.menu button{
    margin:0;
    background:rgba(8,12,22,.94);
    border:1px solid #34415e;
    font-size:13px;
}

#charactersScreen{
    display:none;

    position:fixed;
    inset:0;

    z-index:100;

    background:
        radial-gradient(circle at top,#26345c,#070a12 75%);

    overflow-y:auto;

    padding:20px;
}

.characters-header{
    width:100%;
    max-width:1000px;

    margin:0 auto 15px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.characters-grid{
    width:100%;
    max-width:1000px;

    margin:auto;

    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));

    gap:15px;
}

.character-card{
    min-height:400px;

    background:
        linear-gradient(180deg,#121b31,#080d18);

    border:2px solid #263452;

    border-radius:20px;

    overflow:hidden;

    position:relative;
}

.character-card.selected{
    border-color:#ff9800;

    box-shadow:
        0 0 25px rgba(255,152,0,.3);
}

.character-preview{
    height:310px;
    position:relative;
}

.character-title{
    position:absolute;
    z-index:10;

    top:12px;
    right:12px;

    background:rgba(0,0,0,.65);

    padding:7px 12px;
    border-radius:10px;

    font-weight:bold;
}

.character-card button{
    width:calc(100% - 20px);
    margin:10px;

    background:
        linear-gradient(135deg,#ff9800,#ff3d00);
}

.loading{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#9da8c4;

    text-align:center;
}

.glb-error{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#ff6565;

    text-align:center;

    padding:20px;
}

@media(max-width:650px){

    .topbar{
        flex-direction:column;
        align-items:stretch;
    }

    .currencies{
        justify-content:center;
    }

    .characters-grid{
        grid-template-columns:1fr;
    }

    .character-card{
        min-height:380px;
    }

    .character-preview{
        height:290px;
    }
}

</style>
</head>


<body>


<!-- =============================== -->
<!-- CREATE / LOGIN -->
<!-- =============================== -->

<div
    id="createScreen"
    class="screen"
>

<div class="panel">

<div class="logo">⚔️</div>

<h1>Battle Arena</h1>

<div class="sub">
    مرحباً بك في Battle Arena
</div>

<input
    id="username"

>

>

<div

        margin:20px 0;
        border-top:1px solid #293657;

<input

>

<button
    class="blue"

</button>

<div

<div class="logo">🎉</div>

<!-- =============================== -->

<div id="lobby">

<div class="topbar">

<div class="player-info">

<div id="lobbyName">

ID:

💎
<span id="diamonds">0</span>

    "imports": {

        "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",

<!-- =============================== -->
<!-- MAIN SCRIPT -->
<!-- =============================== -->

<script type="module">

import * as THREE
from "three";

import {
    GLTFLoader
}
from "three/addons/loaders/GLTFLoader.js";


/* =============================== */
/* GLOBAL */
/* =============================== */

let player = null;

let lobbyScene = null;
let lobbyCamera = null;
let lobbyRenderer = null;

let lobbyCharacter = null;

let lobbyClock = null;

let lobbyAnimationId = null;


/* =============================== */
/* CHARACTER FILES */
/* =============================== */

const CHARACTER_FILES = {

    1:
    "/model/characters/634230045_my_avatar.glb",

    2:
    "/model/characters/sunny_leone_creacter_3d_model.glb"

};


const CHARACTER_NAMES = {

    1:
    "الشخصية الأولى",

    2:
    "الشخصية الثانية"

};


const loader =
    new GLTFLoader();


/* =============================== */
/* HELPER */
/* =============================== */

function showError(message){

    document
        .getElementById("createError")
        .textContent =
            message || "حدث خطأ";

}


/* =============================== */
/* CREATE ACCOUNT */
/* =============================== */

window.createAccount =
async function(){

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    showError("");

    document
        .getElementById("loginMessage")
        .textContent = "";


    if(!username){

        showError(
            "اكتب اسم اللاعب"
        );

        return;
    }


    if(username.length < 3){

        showError(
            "الاسم لازم يكون 3 حروف على الأقل"
        );

        return;
    }


    if(username.length > 16){

        showError(
            "الاسم طويل بزاف"
        );

        return;
    }


    try{

        const response =
            await fetch(
                "/api/register",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            characterId:
                                1

                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            showError(
                data.message ||
                "فشل إنشاء الحساب"
            );

            return;
        }


        player =
            data.player;


        /*
        حفظ Account Key
        */

        localStorage.setItem(
            "battleArenaAccountKey",
            data.accountKey
        );


        localStorage.setItem(
            "battleArenaPlayer",
            JSON.stringify(player)
        );


        /*
        شاشة المفتاح
        */

        document
            .getElementById("createScreen")
            .style.display =
                "none";


        document
            .getElementById("keyScreen")
            .style.display =
                "flex";


        document
            .getElementById("newName")
            .textContent =
                player.username;


        document
            .getElementById("newId")
            .textContent =
                "ID: " +
                player.playerId;


        document
            .getElementById("newKey")
            .textContent =
                data.accountKey;


    }catch(error){

        console.error(
            "Register Error:",
            error
        );


        showError(
            "تعذر الاتصال بالسيرفر"
        );

    }

};


/* =============================== */
/* MANUAL LOGIN */
/* =============================== */

window.loginAccount =
async function(){

    const key =
        document
        .getElementById("accountKey")
        .value
        .trim();


    showError("");

    document
        .getElementById("loginMessage")
        .textContent = "";


    if(!key){

        showError(
            "أدخل Account Key"
        );

        return;
    }


    try{

        const response =
            await fetch(
                "/api/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            accountKey:
                                key

                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            showError(
                data.message ||
                "Account Key غير صحيح"
            );

            return;
        }


        player =
            data.player;


        localStorage.setItem(
            "battleArenaAccountKey",
            key
        );


        localStorage.setItem(
            "battleArenaPlayer",
            JSON.stringify(player)
        );


        openLobby();


    }catch(error){

        console.error(
            "Login Error:",
            error
        );

        showError(
            "تعذر الاتصال بالسيرفر"
        );

    }

};


/* =============================== */
/* OPEN LOBBY */
/* =============================== */

window.openLobby =
function(){

    if(!player){

        const saved =
            localStorage.getItem(
                "battleArenaPlayer"
            );


        if(saved){

            try{

                player =
                    JSON.parse(saved);

            }catch{

                player = null;

            }

        }

    }


    if(!player){

        location.reload();

        return;
    }


    document
        .getElementById("keyScreen")
        .style.display =
            "none";


    document
        .getElementById("createScreen")
        .style.display =
            "none";


    document
        .getElementById("charactersScreen")
        .style.display =
            "none";


    document
        .getElementById("lobby")
        .style.display =
            "block";


    updateLobby();


    createLobby3D(
        Number(
            player.characterId || 1
        )
    );

};


/* =============================== */
/* UPDATE LOBBY */
/* =============================== */

function updateLobby(){

    if(!player)
        return;


    document
        .getElementById("lobbyName")
        .textContent =
            player.username;


    document
        .getElementById("lobbyId")
        .textContent =
            player.playerId;


    document
        .getElementById("diamonds")
        .textContent =
            player.diamonds || 0;


    document
        .getElementById("gold")
        .textContent =
            player.gold || 0;


    document
        .getElementById("characterName")
        .textContent =
            CHARACTER_NAMES[
                player.characterId
            ] ||
            "الشخصية";

}


/* =============================== */
/* CHARACTERS PAGE */
/* =============================== */

window.charactersPage =
function(){

    document
        .getElementById("lobby")
        .style.display =
            "none";


    document
        .getElementById("charactersScreen")
        .style.display =
            "block";


    createCharactersCards();

};


/* =============================== */
/* CLOSE CHARACTERS */
/* =============================== */

window.closeCharactersPage =
function(){

    document
        .getElementById("charactersScreen")
        .style.display =
            "none";


    document
        .getElementById("lobby")
        .style.display =
            "block";


    updateLobby();


    createLobby3D(
        Number(
            player.characterId || 1
        )
    );

};


/* =============================== */
/* CHARACTER CARDS */
/* =============================== */

function createCharactersCards(){

    const grid =
        document
        .getElementById(
            "charactersGrid"
        );


    grid.innerHTML = "";


    [1,2].forEach(
        id => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "character-card";


            if(
                Number(
                    player.characterId
                ) === id
            ){

                card.classList.add(
                    "selected"
                );

            }


            card.innerHTML = `

                <div
                    class="character-preview"
                    id="preview-${id}"
                >

                    <div
                        class="character-title"
                    >
                        ${CHARACTER_NAMES[id]}
                    </div>

                    <div class="loading">
                        ⏳ تحميل الشخصية 3D...
                    </div>

                </div>

                <button>
                    ${
                        Number(player.characterId) === id
                        ? "✅ مختارة"
                        : "اختيار الشخصية"
                    }
                </button>

            `;


            const button =
                card.querySelector(
                    "button"
                );


            button.addEventListener(
                "click",
                () => {

                    selectCharacter(id);

                }
            );


            grid.appendChild(card);


            loadCharacterPreview(id);

        }
    );

}


/* =============================== */
/* CHARACTER PREVIEW */
/* =============================== */

function loadCharacterPreview(id){

    const container =
        document.getElementById(
            "preview-" + id
        );


    if(!container)
        return;


    const loading =
        container.querySelector(
            ".loading"
        );


    const width =
        container.clientWidth || 400;

    const height =
        container.clientHeight || 300;


    const scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x101827
        );


    const camera =
        new THREE.PerspectiveCamera(
            40,
            width / height,
            .1,
            100
        );


    camera.position.set(
        0,
        1.5,
        4
    );


    const renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            alpha:true
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        width,
        height
    );


    container.appendChild(
        renderer.domElement
    );


    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x202840,
            2
        );


    scene.add(ambient);


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    light.position.set(
        3,
        5,
        4
    );


    scene.add(light);


    loader.load(

        CHARACTER_FILES[id],

        gltf => {

            if(loading)
                loading.remove();


            const model =
                gltf.scene;


            scene.add(model);


            const box =
                new THREE.Box3()
                .setFromObject(model);


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            model.position.x -=
                center.x;


            model.position.z -=
                center.z;


            model.position.y -=
                box.min.y;


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if(maxSize > 0){

                const scale =
                    2.6 / maxSize;


                model.scale.set(
                    scale,
                    scale,
                    scale
                );

            }


            function animate(){

                requestAnimationFrame(
                    animate
                );


                model.rotation.y +=
                    0.006;


                renderer.render(
                    scene,
                    camera
                );

            }


            animate();

        },

        undefined,

        error => {

            console.error(
                "GLB ERROR:",
                id,
                CHARACTER_FILES[id],
                error
            );


            if(loading)
                loading.remove();


            const errorBox =
                document.createElement(
                    "div"
                );


            errorBox.className =
                "glb-error";


            errorBox.innerHTML =
                `
                ❌ تعذر تحميل الشخصية 3D
                <br><br>
                ${CHARACTER_FILES[id]}
                `;


            container.appendChild(
                errorBox
            );

        }

    );

}


/* =============================== */
/* SELECT CHARACTER */
/* =============================== */

async function selectCharacter(id){

    if(!player)
        return;


    try{

        const response =
            await fetch(
                "/api/player/" +
                player.playerId +
                "/character",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            characterId:id

                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            alert(
                data.message ||
                "فشل حفظ الشخصية"
            );

            return;
        }


        player.characterId =
            Number(
                data.characterId
            );


        localStorage.setItem(
            "battleArenaPlayer",
            JSON.stringify(player)
        );


        createCharactersCards();


    }catch(error){

        console.error(
            error
        );


        alert(
            "تعذر الاتصال بالسيرفر"
        );

    }

}


/* =============================== */
/* LOBBY 3D */
/* =============================== */

function createLobby3D(characterId){

    const container =
        document.getElementById(
            "scene"
        );


    if(!container)
        return;


    if(lobbyAnimationId){

        cancelAnimationFrame(
            lobbyAnimationId
        );

        lobbyAnimationId = null;

    }


    container.innerHTML = "";


    lobbyScene =
        new THREE.Scene();


    lobbyScene.background =
        new THREE.Color(
            0x101827
        );


    lobbyCamera =
        new THREE.PerspectiveCamera(
            45,
            window.innerWidth /
            window.innerHeight,
            .1,
            100
        );


    lobbyCamera.position.set(
        0,
        1.6,
        5
    );


    lobbyRenderer =
        new THREE.WebGLRenderer({
            antialias:true
        });


    lobbyRenderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    lobbyRenderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    container.appendChild(
        lobbyRenderer.domElement
    );


    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x27334d,
            2
        );


    lobbyScene.add(
        ambient
    );


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    light.position.set(
        3,
        5,
        4
    );


    lobbyScene.add(
        light
    );


    const floor =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                2.2,
                2.2,
                .15,
                64
            ),

            new THREE.MeshStandardMaterial({
                color:0x1d293d,
                roughness:.8
            })

        );


    floor.position.y =
        -.08;


    lobbyScene.add(
        floor
    );


    loader.load(

        CHARACTER_FILES[
            characterId
        ],

        gltf => {

            lobbyCharacter =
                gltf.scene;


            lobbyScene.add(
                lobbyCharacter
            );


            const box =
                new THREE.Box3()
                .setFromObject(
                    lobbyCharacter
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            lobbyCharacter.position.x -=
                center.x;


            lobbyCharacter.position.z -=
                center.z;


            lobbyCharacter.position.y -=
                box.min.y;


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if(maxSize > 0){

                const scale =
                    2.7 / maxSize;


                lobbyCharacter.scale.set(
                    scale,
                    scale,
                    scale
                );

            }


            lobbyClock =
                new THREE.Clock();


            animateLobby();

        },

        undefined,

        error => {

            console.error(
                "Lobby GLB Error:",
                CHARACTER_FILES[characterId],
                error
            );

            const message =
                document.createElement(
                    "div"
                );


            message.style.cssText = `
                position:absolute;
                inset:0;
                z-index:5;
                display:flex;
                align-items:center;
                justify-content:center;
                color:#ff6565;
                font-size:16px;
                text-align:center;
                padding:30px;
            `;


            message.innerHTML =
                `
                ❌ تعذر تحميل الشخصية 3D
                <br><br>
                ${CHARACTER_FILES[characterId]}
                `;


            container.appendChild(
                message
            );

        }

    );

}


/* =============================== */
/* LOBBY ANIMATION */
/* =============================== */

function animateLobby(){

    lobbyAnimationId =
        requestAnimationFrame(
            animateLobby
        );


    if(
        lobbyCharacter &&
        lobbyClock
    ){

        const time =
            lobbyClock
            .getElapsedTime();


        lobbyCharacter.rotation.y =
            Math.sin(
                time * .45
            ) * .12;

    }


    if(
        lobbyRenderer &&
        lobbyScene &&
        lobbyCamera
    ){

        lobbyRenderer.render(
            lobbyScene,
            lobbyCamera
        );

    }

}


/* =============================== */
/* PLAY */
/* =============================== */

window.playGame =
function(){

    alert(
        "🎮 طور اللعب راح نضيفوه في المرحلة الجاية!"
    );

};


/* =============================== */
/* AUTO LOGIN */
/* =============================== */

async function autoLogin(){

    const key =
        localStorage.getItem(
            "battleArenaAccountKey"
        );


    if(!key){

        document
            .getElementById(
                "createScreen"
            )
            .style.display =
                "flex";

        return;
    }


    try{

        const response =
            await fetch(
                "/api/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            accountKey:key

                        })
                }
            );


        const data =
            await response.json();


        if(!response.ok || !data.success){

            /*
            مهم:
            ما نمسحوش المفتاح مباشرة.
            إذا كان السيرفر فيه مشكلة مؤقتة
            ما نضيعوش الحساب.
            */

            console.warn(
                "Auto login failed:",
                data.message
            );


            document
                .getElementById(
                    "createScreen"
                )
                .style.display =
                    "flex";


            return;
        }


        player =
            data.player;


        localStorage.setItem(
            "battleArenaPlayer",
            JSON.stringify(player)
        );


        openLobby();


    }catch(error){

        console.error(
            "Auto login network error:",
            error
        );


        /*
        الحساب يبقى محفوظ.
        */

        const saved =
            localStorage.getItem(
                "battleArenaPlayer"
            );


        if(saved){

            try{

                player =
                    JSON.parse(saved);


                openLobby();


                return;

            }catch{

                player = null;

            }

        }


        document
            .getElementById(
                "createScreen"
            )
            .style.display =
                "flex";

    }

}


/* =============================== */
/* RESIZE */
/* =============================== */

window.addEventListener(
    "resize",
    () => {

        if(
            lobbyCamera &&
            lobbyRenderer
        ){

            lobbyCamera.aspect =
                window.innerWidth /
                window.innerHeight;


            lobbyCamera.updateProjectionMatrix();


            lobbyRenderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }

    }
);


/* =============================== */
/* START */
/* =============================== */

autoLogin();

</script>
