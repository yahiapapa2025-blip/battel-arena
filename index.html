<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Battle Arena</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #173b75,
          #050914 65%
        );
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 92%;
      max-width: 430px;
      background: rgba(7, 14, 30, .94);
      border: 1px solid #2563eb;
      border-radius: 22px;
      padding: 28px;
      box-shadow:
        0 0 40px rgba(0, 110, 255, .25);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #4da3ff;
    }

    .sub {
      text-align: center;
      color: #aebbd0;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #263b60;
      border-radius: 12px;
      background: #0b1427;
      color: white;
      outline: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      margin-top: 8px;
      background: #1677ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0d64df;
    }

    .characters {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }

    .character {
      flex: 1;
      padding: 14px;
      border: 2px solid #263b60;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      background: #0b1427;
    }

    .character.selected {
      border-color: #1683ff;
      background: #102d5a;
    }

    .account {
      display: none;
    }

    .account-key {
      background: #020712;
      border: 1px dashed #3b82f6;
      padding: 13px;
      border-radius: 10px;
      word-break: break-all;
      direction: ltr;
      text-align: center;
      margin: 12px 0;
    }

    .message {
      min-height: 25px;
      text-align: center;
      color: #ffcc66;
      margin-top: 12px;
    }

    .danger {
      color: #ff7070;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>⚔️ Battle Arena</h1>

  <div id="loginScreen">

    <div class="sub">
      مرحباً بك في Battle Arena
    </div>

    <input
      id="username"
      maxlength="16"
      placeholder="اسم اللاعب"
      autocomplete="off"
    >

    <div>
      اختر شخصيتك:
    </div>

    <div class="characters">

      <div
        class="character selected"
        data-character="1"
      >
        الشخصية 1
      </div>

      <div
        class="character"
        data-character="2"
      >
        الشخصية 2
      </div>

    </div>

    <button id="createBtn">
      إنشاء حساب
    </button>

    <hr style="border-color:#1d2d49;margin:25px 0">

    <input
      id="accountKey"
      placeholder="Account Key"
      autocomplete="off"
    >

    <button id="loginBtn">
      دخول بالحساب
    </button>

    <div
      id="message"
      class="message"
    ></div>

  </div>

  <div
    id="accountScreen"
    class="account"
  >

    <h2 style="text-align:center">
      ✅ حسابك محفوظ
    </h2>

    <p>
      الاسم:
      <b id="savedUsername"></b>
    </p>

    <p>
      Player ID:
      <b id="savedPlayerId"></b>
    </p>

    <p>
      Account Key:
    </p>

    <div
      id="savedKey"
      class="account-key"
    ></div>

    <button id="enterBtn">
      دخول إلى اللوبي 🎮
    </button>

  </div>

</div>

<script>

const STORAGE_KEY =
  "battleArenaAccount";

let selectedCharacter = 1;

// ================================
// CHARACTER SELECT
// ================================

document
  .querySelectorAll(".character")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".character")
          .forEach(x =>
            x.classList.remove("selected")
          );

        button.classList.add("selected");

        selectedCharacter =
          Number(
            button.dataset.character
          );
      }
    );

  });

// ================================
// MESSAGE
// ================================

function message(text, danger = false) {

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    danger
      ? "message danger"
      : "message";
}

// ================================
// SAVE ACCOUNT
// ================================

function saveAccount(account) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(account)
  );
}

// ================================
// LOAD SAVED ACCOUNT
// ================================

function getSavedAccount() {

  try {

    const data =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (!data) {
      return null;
    }

    return JSON.parse(data);

  } catch {

    localStorage.removeItem(
      STORAGE_KEY
    );

    return null;
  }
}

// ================================
// SHOW ACCOUNT
// ================================

function showSavedAccount(account) {

  document.getElementById(
    "loginScreen"
  ).style.display = "none";

  document.getElementById(
    "accountScreen"
  ).style.display = "block";

  document.getElementById(
    "savedUsername"
  ).textContent =
    account.username;

  document.getElementById(
    "savedPlayerId"
  ).textContent =
    account.playerId;

  document.getElementById(
    "savedKey"
  ).textContent =
    account.accountKey;
}

// ================================
// CREATE ACCOUNT
// ================================

document
  .getElementById("createBtn")
  .addEventListener(
    "click",
    async () => {

      const username =
        document
          .getElementById("username")
          .value
          .trim();

      if (!username) {
        message(
          "اكتب اسم اللاعب",
          true
        );
        return;
      }

      try {

        message(
          "جاري إنشاء الحساب..."
        );

        const response =
          await fetch(
            "/api/register",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  username,
                  characterId:
                    selectedCharacter
                })
            }
          );

        const data =
          await response.json();

        if (!data.success) {

          message(
            data.message ||
            "فشل إنشاء الحساب",
            true
          );

          return;
        }

        const account = {

          accountKey:
            data.accountKey,

          playerId:
            data.player.playerId,

          username:
            data.player.username,

          characterId:
            data.player.characterId
        };

        saveAccount(account);

        showSavedAccount(account);

      } catch (error) {

        console.error(error);

        message(
          "تعذر الاتصال بالسيرفر",
          true
        );
      }
    }
  );

// ================================
// LOGIN
// ================================

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    async () => {

      const accountKey =
        document
          .getElementById("accountKey")
          .value
          .trim();

      if (!accountKey) {

        message(
          "أدخل Account Key",
          true
        );

        return;
      }

      try {

        message(
          "جاري تسجيل الدخول..."
        );

        const response =
          await fetch(
            "/api/login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  accountKey
                })
            }
          );

        const data =
          await response.json();

        if (!data.success) {

          message(
            data.message ||
            "فشل تسجيل الدخول",
            true
          );

          return;
        }

        const account = {

          accountKey,

          playerId:
            data.player.playerId,

          username:
            data.player.username,

          characterId:
            data.player.characterId
        };

        saveAccount(account);

        showSavedAccount(account);

      } catch (error) {

        console.error(error);

        message(
          "تعذر الاتصال بالسيرفر",
          true
        );
      }
    }
  );

// ================================
// ENTER GAME
// ================================

document
  .getElementById("enterBtn")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "/character-test.html";

    }
  );

// ================================
// AUTO RESTORE
// ================================

const saved =
  getSavedAccount();

if (saved) {
  showSavedAccount(saved);
}

</script>

</body>
</html>
