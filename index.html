<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Battle Arena</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at top,
      #26355f,
      #090d18 65%
    );

  color: white;

  display: flex;

  justify-content: center;

  align-items: center;

}


.container {

  width: 92%;

  max-width: 430px;

  background:
    rgba(12, 17, 31, .94);

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius: 24px;

  padding: 28px;

  text-align: center;

  box-shadow:
    0 20px 70px
    rgba(0,0,0,.5);

}


.logo {

  font-size: 65px;

  margin-bottom: 5px;

}


h1 {

  margin: 0;

  font-size: 30px;

  letter-spacing: 2px;

}


.sub {

  color: #aab4cc;

  margin:
    10px 0 22px;

}


input {

  width: 100%;

  padding: 15px;

  border-radius: 12px;

  border: 1px solid #394462;

  background: #11182a;

  color: white;

  font-size: 16px;

  outline: none;

  text-align: center;

}


button {

  width: 100%;

  padding: 14px;

  margin-top: 12px;

  border: 0;

  border-radius: 12px;

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


.random {

  background: #303b5b;

}


.create {

  background:
    linear-gradient(
      135deg,
      #ff7b00,
      #ff3d00
    );

}


.login {

  background: #273352;

}


.result {

  display: none;

}


.id {

  font-size: 26px;

  font-weight: bold;

  color: #ffc107;

  margin-top: 12px;

}


.key {

  margin-top: 15px;

  padding: 12px;

  background: #0b1221;

  border-radius: 10px;

  word-break: break-all;

  color: #63e6be;

  font-family: monospace;

}


.warning {

  color: #ffcc66;

  font-size: 13px;

  margin-top: 10px;

}


.error {

  color: #ff6b6b;

  margin-top: 15px;

}


.lobby {

  display: none;

}


.lobby-card {

  background: #11182a;

  border-radius: 16px;

  padding: 20px;

  margin-top: 20px;

}


.stat {

  display: flex;

  justify-content: space-between;

  padding: 10px 0;

  border-bottom:
    1px solid #29334b;

}


.stat:last-child {

  border-bottom: 0;

}


.badge {

  color: #ffd43b;

}


</style>

</head>


<body>


<div class="container">


<!-- ================================= -->
<!-- CREATE -->
<!-- ================================= -->

<div id="createScreen">

  <div class="logo">⚔️</div>

  <h1>BATTLE ARENA</h1>

  <div class="sub">
    أنشئ حسابك وابدأ المعركة 🔥
  </div>


  <input
    id="username"
    type="text"
    maxlength="16"
    placeholder="اسم اللاعب"
  >


  <button
    class="random"
    onclick="randomName()"
  >
    🎲 اسم عشوائي
  </button>


  <button
    class="create"
    onclick="createAccount()"
  >
    🚀 إنشاء الحساب
  </button>


  <div
    id="createError"
    class="error"
  ></div>

</div>


<!-- ================================= -->
<!-- ACCOUNT KEY -->
<!-- ================================= -->

<div
  id="keyScreen"
  class="result"
>

  <div class="logo">🎉</div>

  <h2>
    تم إنشاء حسابك!
  </h2>

  <div id="newPlayerName"></div>

  <div
    class="id"
    id="newPlayerId"
  ></div>


  <div class="key">
    <span id="accountKey"></span>
  </div>


  <div class="warning">

    ⚠️ هذا Account Key مهم.
    احتفظ به في مكان آمن للدخول إلى حسابك
    من جهاز آخر.

  </div>


  <button
    class="create"
    onclick="enterLobby()"
  >
    🎮 دخول للّوبي
  </button>

</div>


<!-- ================================= -->
<!-- LOGIN -->
<!-- ================================= -->

<div
  id="loginScreen"
  class="result"
>

  <div class="logo">🔐</div>

  <h2>
    مرحبًا بك من جديد
  </h2>

  <div class="sub">
    أدخل Account Key تاع حسابك
  </div>


  <input
    id="accountKeyInput"
    type="password"
    placeholder="Account Key"
  >


  <button
    class="login"
    onclick="loginAccount()"
  >
    🔓 دخول
  </button>


  <div
    id="loginError"
    class="error"
  ></div>

</div>


<!-- ================================= -->
<!-- LOBBY -->
<!-- ================================= -->

<div
  id="lobbyScreen"
  class="lobby"
>

  <div class="logo">
    ⚔️
  </div>

  <h1>
    BATTLE ARENA
  </h1>

  <div class="sub">
    مرحبًا بك في اللّوبي 🔥
  </div>


  <div class="lobby-card">


    <h2 id="lobbyName">
      Player
    </h2>


    <div class="stat">

      <span>
        🆔 ID
      </span>

      <strong id="lobbyId">
        -
      </strong>

    </div>


    <div class="stat">

      <span>
        💎 Diamonds
      </span>

      <strong id="lobbyDiamonds">
        0
      </strong>

    </div>


    <div class="stat">

      <span>
        🪙 Gold
      </span>

      <strong id="lobbyGold">
        0
      </strong>

    </div>


    <div class="stat">

      <span>
        ⭐ Level
      </span>

      <strong id="lobbyLevel">
        1
      </strong>

    </div>


    <div
      class="stat"
      id="developerRow"
      style="display:none"
    >

      <span>
        👑
      </span>

      <strong class="badge">
        DEVELOPER
      </strong>

    </div>


  </div>

</div>


</div>


<script>


// ======================================
// 🎲 RANDOM NAME
// ======================================

function randomName() {

  const names = [

    "ShadowX",

    "YahiaPro",

    "DarkWolf",

    "FireKing",

    "GhostX",

    "BattleGod",

    "NightX",

    "DragonX",

    "Falcon7",

    "WarriorX"

  ];


  const name =
    names[
      Math.floor(
        Math.random() *
        names.length
      )
    ];


  document
    .getElementById("username")
    .value = name;

}


// ======================================
// 💾 SAVE PLAYER
// ======================================

function savePlayer(player) {

  localStorage.setItem(
    "battleArenaPlayer",
    JSON.stringify(player)
  );

}


// ======================================
// 📦 GET SAVED PLAYER
// ======================================

function getSavedPlayer() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "battleArenaPlayer"
      )
    );

  } catch {

    return null;

  }

}


// ======================================
// 🎮 SHOW LOBBY
// ======================================

function showLobby(player) {

  document
    .getElementById("createScreen")
    .style.display = "none";


  document
    .getElementById("keyScreen")
    .style.display = "none";


  document
    .getElementById("loginScreen")
    .style.display = "none";


  document
    .getElementById("lobbyScreen")
    .style.display = "block";


  document
    .getElementById("lobbyName")
    .textContent =
      player.username;


  document
    .getElementById("lobbyId")
    .textContent =
      player.playerId;


  document
    .getElementById("lobbyDiamonds")
    .textContent =
      player.diamonds || 0;


  document
    .getElementById("lobbyGold")
    .textContent =
      player.gold || 0;


  document
    .getElementById("lobbyLevel")
    .textContent =
      player.level || 1;


  if (player.developerBadge) {

    document
      .getElementById(
        "developerRow"
      )
      .style.display = "flex";

  }

}


// ======================================
// 🚀 CREATE ACCOUNT
// ======================================

async function createAccount() {

  const username =
    document
      .getElementById("username")
      .value
      .trim();


  const error =
    document
      .getElementById("createError");


  error.textContent = "";


  if (!username) {

    error.textContent =
      "اكتب اسم اللاعب";

    return;

  }


  try {

    const response =
      await fetch(
        "/api/register",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            username

          })

        }
      );


    const data =
      await response.json();


    if (!data.success) {

      error.textContent =
        data.message ||
        "فشل إنشاء الحساب";

      return;

    }


    // نحفظ الحساب محليًا
    savePlayer(
      data.player
    );


    document
      .getElementById(
        "createScreen"
      )
      .style.display = "none";


    document
      .getElementById(
        "keyScreen"
      )
      .style.display = "block";


    document
      .getElementById(
        "newPlayerName"
      )
      .textContent =
        data.player.username;


    document
      .getElementById(
        "newPlayerId"
      )
      .textContent =
        "ID: " +
        data.player.playerId;


    document
      .getElementById(
        "accountKey"
      )
      .textContent =
        data.accountKey;


    // نخزن المفتاح في الجهاز
    localStorage.setItem(
      "battleArenaAccountKey",
      data.accountKey
    );


  } catch (error) {

    console.error(error);

    document
      .getElementById(
        "createError"
      )
      .textContent =
        "تعذر الاتصال بالسيرفر";

  }

}


// ======================================
// 🔐 LOGIN
// ======================================

async function loginAccount() {

  const accountKey =
    document
      .getElementById(
        "accountKeyInput"
      )
      .value
      .trim();


  const error =
    document
      .getElementById(
        "loginError"
      );


  error.textContent = "";


  if (!accountKey) {

    error.textContent =
      "أدخل Account Key";

    return;

  }


  try {

    const response =
      await fetch(
        "/api/login",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            accountKey

          })

        }
      );


    const data =
      await response.json();


    if (!data.success) {

      error.textContent =
        data.message ||
        "فشل تسجيل الدخول";

      return;

    }


    savePlayer(
      data.player
    );


    localStorage.setItem(
      "battleArenaAccountKey",
      accountKey
    );


    showLobby(
      data.player
    );


  } catch {

    error.textContent =
      "تعذر الاتصال بالسيرفر";

  }

}


// ======================================
// 🎮 ENTER LOBBY
// ======================================

function enterLobby() {

  const player =
    getSavedPlayer();


  if (!player) {

    location.reload();

    return;

  }


  showLobby(player);

}


// ======================================
// 🔄 START
// ======================================

async function startGame() {

  const savedPlayer =
    getSavedPlayer();


  const savedKey =
    localStorage.getItem(
      "battleArenaAccountKey"
    );


  // إذا عندو حساب محفوظ + مفتاح
  if (
    savedPlayer &&
    savedKey
  ) {

    // نتحقق من السيرفر
    try {

      const response =
        await fetch(
          "/api/login",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              accountKey:
                savedKey

            })

          }
        );


      const data =
        await response.json();


      if (data.success) {

        savePlayer(
          data.player
        );

        showLobby(
          data.player
        );

        return;

      }

    } catch {}

  }


  // إذا ما عندوش حساب
  document
    .getElementById(
      "createScreen"
    )
    .style.display = "block";

}


startGame();

</script>

</body>

</html>
