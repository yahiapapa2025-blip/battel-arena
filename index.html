<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Battle Arena</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="topbar">

<div class="profile">
👤 <span id="username">Loading...</span>
</div>

<div class="money">
💎 <span id="diamonds">0</span>
</div>

<div class="money">
🪙 <span id="gold">0</span>
</div>

<div class="money">
⭐ Lv.<span id="level">1</span>
</div>

</div>

<div class="center">

<h1>🎮 Battle Arena</h1>

<button onclick="startGame()">
▶ START
</button>

<button onclick="openStore()">
🛒 STORE
</button>

<button onclick="openInventory()">
🎒 INVENTORY
</button>

<button onclick="openSettings()">
⚙ SETTINGS
</button>

</div>

<script src="app.js"></script>

</body>
</html>
