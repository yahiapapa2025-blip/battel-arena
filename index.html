<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Battle Arena</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #26345c 0%, #10162b 35%, #060912 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .card {
      background: rgba(15, 22, 42, 0.94);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.55);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 25px;

      background:
        linear-gradient(135deg, #ff9d00, #ff3d00);

      font-size: 48px;

      box-shadow:
        0 0 35px rgba(255,100,0,0.35);
    }

    h1 {
      margin: 5px 0;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .sub {
      color: #aeb9d5;
      margin: 10px 0 25px;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 13px;
      border-radius: 20px;

      background: rgba(34,197,94,0.12);
      color: #4ade80;

      font-size: 13px;
      margin-bottom: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    input {
      width: 100%;
      padding: 16px;

      border-radius: 14px;
      border: 1px solid #303b5a;

      background: #0a1020;
      color: white;

      outline: none;
      font-size: 16px;

      text-align: center;
    }

    input:focus {
      border-color: #ff7a00;
      box-shadow: 0 0 15px rgba(255,122,0,0.15);
    }

    button {
      width: 100%;
      padding: 15px;

      border: 0;
      border-radius: 14px;

      color: white;
      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
      margin-top: 12px;
    }

    .random {
      background: #202b47;
    }

    .random:hover {
      background: #293755;
    }

    .create {
      background:
        linear-gradient(135deg, #ff9d00, #ff3d00);

      box-shadow:
        0 10px 25px rgba(255,80,0,0.2);
    }

    .create:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      display: none;

      margin-top: 20px;
      padding: 20px;

      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.25);

      border-radius: 18px;
    }

    .player-name {
      margin-top: 8px;
      color: #d7def0;
    }

    .id {
      margin-top: 12px;

      font-size: 26px;
      font-weight: bold;

      color: #ffd166;

      letter-spacing: 2px;
    }

    .error {
      display: none;

      margin-top: 15px;
      padding: 12px;

      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);

      color: #ff7b7b;
      border-radius: 12px;
    }

    .footer {
      margin-top: 22px;
      color: #697590;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">⚔️</div>

      <h1>BATTLE ARENA</h1>

      <div class="sub">
        أنشئ حسابك وابدأ المعركة 🔥
      </div>

      <div class="online">
        <span class="dot"></span>
        السيرفر متصل
      </div>

      <input
        id="username"
        type="text"
        maxlength="16"
        placeholder="اسم اللاعب"
        autocomplete="off"
      >

      <button
        class="random"
        onclick="randomName()"
      >
        🎲 اسم عشوائي
      </button>

      <button
        id="createButton"
        class="create"
        onclick="createAccount()"
      >
        🚀 إنشاء الحساب
      </button>

      <div
        id="result"
        class="result"
      >
        <div>🎉 تم إنشاء حسابك!</div>

        <div
          id="playerName"
          class="player-name"
        ></div>

        <div
          id="playerId"
          class="id"
        ></div>

        <div style="color:#9da8c4;margin-top:5px">
          هذا هو ID تاعك
        </div>
      </div>

      <div
        id="error"
        class="error"
      ></div>

      <div class="footer">
        Battle Arena © 2026
      </div>

    </div>

  </div>

<script>

const usernameInput =
  document.getElementById("username");

const createButton =
  document.getElementById("createButton");

const result =
  document.getElementById("result");

const errorBox =
  document.getElementById("error");


// ================================
// 🎲 RANDOM NAME
// ================================

function randomName() {

  const names = [
    "Shadow",
    "DarkWolf",
    "FireKing",
    "BattleX",
    "Warrior",
    "Hunter",
    "Ghost",
    "BlidaX",
    "Yahia",
    "Dragon",
    "Storm",
    "Falcon",
    "NightX",
    "Titan"
  ];

  const name =
    names[Math.floor(Math.random() * names.length)];

  const number =
    Math.floor(100 + Math.random() * 900);

  usernameInput.value =
    name + number;
}


// ================================
// 🚀 CREATE ACCOUNT
// ================================

async function createAccount() {

  const username =
    usernameInput.value.trim();

  errorBox.style.display = "none";
  result.style.display = "none";

  if (!username) {

    showError("❌ اكتب اسم اللاعب");

    return;
  }

  if (username.length < 3) {

    showError(
      "❌ اسم اللاعب لازم يكون 3 حروف على الأقل"
    );

    return;
  }

  createButton.disabled = true;

  createButton.textContent =
    "⏳ جاري إنشاء الحساب...";

  try {

    const response =
      await fetch("/api/register", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          username
        })

      });

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      showError(
        "❌ " +
        (data.message ||
        "فشل إنشاء الحساب")
      );

      return;
    }

    document.getElementById(
      "playerName"
    ).textContent =
      "👤 " + data.player.username;

    document.getElementById(
      "playerId"
    ).textContent =
      "🆔 " + data.player.playerId;

    result.style.display = "block";

    usernameInput.value = "";

  } catch (error) {

    console.error(
      "Register Error:",
      error
    );

    showError(
      "❌ تعذر الاتصال بالسيرفر"
    );

  } finally {

    createButton.disabled = false;

    createButton.textContent =
      "🚀 إنشاء الحساب";
  }
}


// ================================
// ❌ ERROR
// ================================

function showError(message) {

  errorBox.textContent = message;

  errorBox.style.display = "block";
}


// ================================
// ⌨️ ENTER
// ================================

usernameInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      createAccount();
    }

  }
);

</script>

</body>
</html>
